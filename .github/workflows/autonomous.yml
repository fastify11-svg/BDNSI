name: Autonomous CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the already verified main branch to production'
        required: true
        default: false
        type: boolean

jobs:
  test-and-deploy:
    name: Autonomous Lifecycle
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bdnsi_testing
          MYSQL_USER: bdnsi_test_user
          MYSQL_PASSWORD: safe_test_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      # ─── 1. CHECKOUT ─────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ─── 2. PHP SETUP ────────────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, sqlite3, gd, zip
          coverage: none

      # ─── 3. ENVIRONMENT SETUP ────────────────────────────────────────────
      - name: Setup Environment
        run: |
          cp .env.example .env
          # PHPUnit safety guard requires this isolated MySQL database.
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=bdnsi_testing/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=bdnsi_test_user/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=safe_test_password/' .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=true/' .env
          sed -i 's/APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/CACHE_DRIVER=.*/CACHE_DRIVER=file/' .env
          sed -i 's/SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          # CI does not require Redis or a background queue worker.
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=/' .env
          sed -i 's/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          echo "APP_URL=http://127.0.0.1:8000" >> .env
          echo "CI=true" >> .env
          echo "--- .env DB/Session config ---"
          grep -E '^(DB_|SESSION_|CACHE_|APP_URL|APP_ENV|QUEUE_)' .env

      # ─── 4. COMPOSER ─────────────────────────────────────────────────────
      - name: Install Composer Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
          # Ensure all packages (Inertia, Laratrust, etc.) are discovered
          php artisan package:discover --ansi

      - name: Generate App Key
        run: php artisan key:generate

      # ─── 5. DATABASE ─────────────────────────────────────────────────────
      - name: Run Database Migrations & Seeding
        run: |
          php artisan migrate:fresh --seed --force -vvv > setup.log 2>&1 || (cat setup.log && exit 1)
          echo "--- Verify admin was seeded ---"
          php artisan tinker --execute="echo 'Admin count: ' . \App\Models\Admin::count() . PHP_EOL . 'Admin email: ' . (\App\Models\Admin::first()->email ?? 'NONE');"

      - name: Run PHP Regression Suite
        run: php artisan test

      # ─── 6. NODE.JS & NPM ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: |
          # --legacy-peer-deps: @inertiajs/inertia-react@0.8.1 requires react ^16-18, we have react 19
          npm install --legacy-peer-deps

      # ─── 7. BUILD FRONTEND ───────────────────────────────────────────────
      - name: Compile Frontend Assets
        run: |
          npm run build
          echo "--- Verify build output ---"
          ls -la public/build/manifest.json 2>/dev/null || ls -la public/build/.vite/manifest.json 2>/dev/null || echo "WARNING: No Vite manifest found!"
          ls -la public/build/assets/ | head -5
        env:
          NODE_ENV: production

      # ─── 8. PLAYWRIGHT TESTS ─────────────────────────────────────────────
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Install wait-on
        run: npm install -g wait-on

      - name: Start Laravel Server
        run: php artisan serve --host=127.0.0.1 --port=8000 > /dev/null 2>&1 &

      - name: Wait for Server to be Ready
        run: wait-on http://127.0.0.1:8000 -t 30000

      - name: Smoke Test - Verify Server Responds
        run: |
          echo "--- Testing key routes ---"
          curl -s -o /dev/null -w "Homepage: %{http_code}\n" http://127.0.0.1:8000/
          curl -s -o /dev/null -w "Admin Login: %{http_code}\n" http://127.0.0.1:8000/admin/login
          curl -s -o /dev/null -w "User Login: %{http_code}\n" http://127.0.0.1:8000/login
          # Test that admin login form actually works (POST with CSRF)
          echo "--- Testing admin login POST ---"
          CSRF=$(curl -s http://127.0.0.1:8000/admin/login | grep -oP 'name="csrf-token" content="\K[^"]+' || echo "NO_CSRF_FOUND")
          echo "CSRF Token: ${CSRF:0:10}..."
          LOGIN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://127.0.0.1:8000/admin/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "X-CSRF-TOKEN: $CSRF" \
            -b /tmp/cookies.txt -c /tmp/cookies.txt \
            -d "email=admin@gmail.com&password=12345678" \
            -L --max-redirs 3)
          echo "Login response code: $(echo "$LOGIN_RESPONSE" | tail -1)"

      - name: Run Playwright Tests
        run: |
          # Run only smoke/connectivity tests in CI
          # Auth-dependent specs remain outside this smoke suite for runtime stability.
          npx playwright test \
            tests/e2e/frontend.spec.js \
            tests/e2e/frontend-connectivity.spec.js \
            > playwright-output.log 2>&1 || (cat playwright-output.log && exit 1)
        env:
          APP_URL: http://127.0.0.1:8000
          ADMIN_EMAIL: admin@gmail.com
          ADMIN_PASSWORD: '12345678'
          CENTER_EMAIL: center@gmail.com
          CENTER_PASSWORD: '12345678'

      # ─── 9. DEPLOY (manual approval only) ───────────────────────────────
      - name: Deploy to Live Server via SSH
        if: success() && github.event_name == 'workflow_dispatch' && inputs.deploy == true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          echo "=== Deploying to Hostinger Live Server ==="
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PASS" ] || [ -z "$SSH_PORT" ]; then
            echo "Required SSH deployment secrets are not configured."
            exit 1
          fi
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          sshpass -p "$SSH_PASS" ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            cd /home/u881397359/domains/nenobet.live/public_html &&
            git fetch origin main &&
            git reset --hard origin/main &&
            composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs &&
            php artisan config:cache &&
            php artisan route:cache &&
            php artisan view:cache &&
            php artisan migrate --force &&
            echo DEPLOYMENT_COMPLETE
          "
          echo "Live server deployment completed."

      # ─── 10. ARTIFACTS ON FAILURE ────────────────────────────────────────
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.run_number }}
          path: |
            playwright-output.log
            setup.log
          retention-days: 3
