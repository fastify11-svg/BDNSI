name: Autonomous CI Pipeline

# CI only. Production hosting is deployed from the generated shared-hosting package.

on:
  push:
    branches: [main, refactor/repo-cleanup-release-system]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bdnsi-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Application Quality Gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bdnsi_testing
          MYSQL_USER: bdnsi_test_user
          MYSQL_PASSWORD: safe_test_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, gd, zip
          coverage: none

      - name: Setup test environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=true/' .env
          sed -i 's#APP_URL=.*#APP_URL=http://127.0.0.1:8000#' .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=bdnsi_testing/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=bdnsi_test_user/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=safe_test_password/' .env
          sed -i 's/CACHE_DRIVER=.*/CACHE_DRIVER=file/' .env || true
          sed -i 's/SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env || true
          sed -i 's/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env || true
          printf '\nCI=true\n' >> .env

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Composer security audit
        continue-on-error: true
        env:
          COMPOSER_NO_AUDIT: '0'
        run: composer audit --locked --no-interaction

      - name: Generate app key and discover packages
        run: |
          php artisan key:generate
          php artisan package:discover --ansi

      - name: Assert MySQL test driver
        run: php artisan tinker --execute="if (DB::connection()->getDriverName() !== 'mysql') { throw new RuntimeException('CI database driver must be mysql'); } echo 'CI database driver: mysql' . PHP_EOL;"

      - name: Run database migrations and seeders
        run: php artisan migrate:fresh --seed --force -vvv > setup.log 2>&1 || (cat setup.log && exit 1)

      - name: Run PHP regression suite
        run: php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install NPM dependencies
        run: npm ci --legacy-peer-deps

      - name: NPM production security audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Compile frontend assets
        env:
          NODE_ENV: production
        run: |
          npm run build
          test -f public/build/manifest.json || test -f public/build/.vite/manifest.json
          test -d public/build/assets

      - name: Verify committed build parity
        shell: bash
        run: |
          BUILD_STATUS="$(git status --porcelain -- public/build)"
          if [ -n "$BUILD_STATUS" ]; then
            echo "Committed public/build does not match a fresh production build:"
            echo "$BUILD_STATUS"
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Install wait-on
        run: npm install -g wait-on

      - name: Start Laravel server
        run: php artisan serve --host=127.0.0.1 --port=8000 > /dev/null 2>&1 &

      - name: Wait for server
        run: wait-on http://127.0.0.1:8000 -t 30000

      - name: Strict smoke test
        shell: bash
        run: |
          check_200() {
            local label="$1" path="$2" code
            code=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000${path}")
            echo "${label}: ${code}"
            test "$code" = "200"
          }
          check_200 "Homepage" "/"
          check_200 "Admin Login Page" "/admin/login"
          check_200 "User Login Page" "/login"
          check_200 "Public Result Page" "/result"
          check_200 "All Courses Page" "/all-course"
          check_200 "Health" "/health"

      - name: Run Playwright tests
        env:
          APP_URL: http://127.0.0.1:8000
          ADMIN_EMAIL: admin@gmail.com
          ADMIN_PASSWORD: '12345678'
          CENTER_EMAIL: center@gmail.com
          CENTER_PASSWORD: '12345678'
        run: |
          npx playwright test \
            tests/e2e/frontend.spec.js \
            tests/e2e/frontend-connectivity.spec.js \
            > playwright-output.log 2>&1 || (cat playwright-output.log && exit 1)

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.run_number }}
          path: |
            playwright-output.log
            setup.log
          retention-days: 3
