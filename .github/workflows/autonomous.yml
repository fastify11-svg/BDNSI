name: Autonomous CI Pipeline

# CI-ONLY pipeline — no production SSH deployment.
# Production deployment remains direct SSH and requires an explicit release decision.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: bdnsi-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Autonomous Lifecycle
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bdnsi_testing
          MYSQL_USER: bdnsi_test_user
          MYSQL_PASSWORD: safe_test_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, gd, zip
          coverage: none

      - name: Setup Environment
        run: |
          cp .env.example .env
          sed -i 's/APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=true/' .env
          sed -i 's#APP_URL=.*#APP_URL=http://127.0.0.1:8000#' .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=bdnsi_testing/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=bdnsi_test_user/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=safe_test_password/' .env
          sed -i 's/CACHE_DRIVER=.*/CACHE_DRIVER=file/' .env
          sed -i 's/SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=/' .env
          echo "CI=true" >> .env
          echo "--- .env DB/Session config ---"
          grep -E '^(DB_|SESSION_|CACHE_|APP_URL|APP_ENV|QUEUE_)' .env

      - name: Validate Composer Metadata
        run: composer validate --no-check-publish

      - name: Install Composer Dependencies
        run: composer install --no-scripts --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Composer Security Audit
        continue-on-error: true
        env:
          COMPOSER_NO_AUDIT: '0'
        run: composer audit --locked --no-interaction

      - name: Generate App Key
        run: php artisan key:generate

      - name: Discover Composer Packages
        run: php artisan package:discover --ansi

      - name: Assert MySQL Test Driver
        run: |
          php artisan tinker --execute="if (DB::connection()->getDriverName() !== 'mysql') { throw new RuntimeException('CI database driver must be mysql'); } echo 'CI database driver: mysql' . PHP_EOL;"

      - name: Run Database Migrations & Seeding
        run: |
          php artisan migrate:fresh --seed --force -vvv > setup.log 2>&1 || (cat setup.log && exit 1)
          php artisan tinker --execute="echo 'Admin count: ' . \App\Models\Admin::count() . PHP_EOL . 'Admin email: ' . (\App\Models\Admin::first()->email ?? 'NONE');"

      - name: Run PHP Regression Suite
        run: php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci --legacy-peer-deps

      - name: NPM Production Security Audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Compile Frontend Assets
        run: |
          npm run build
          test -f public/build/manifest.json || test -f public/build/.vite/manifest.json
          test -d public/build/assets
        env:
          NODE_ENV: production

      - name: Verify Committed Build Parity
        run: |
          BUILD_STATUS="$(git status --porcelain -- public/build)"
          if [ -n "$BUILD_STATUS" ]; then
            echo "Committed public/build does not match a fresh production build:"
            echo "$BUILD_STATUS"
            exit 1
          fi

      - name: Validate Direct-SSH Deploy Script Syntax
        run: node --check deploy_to_production.mjs

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Install wait-on
        run: npm install -g wait-on

      - name: Start Laravel Server
        run: php artisan serve --host=127.0.0.1 --port=8000 > /dev/null 2>&1 &

      - name: Wait for Server to be Ready
        run: wait-on http://127.0.0.1:8000 -t 30000

      - name: Strict Smoke Test
        run: |
          check_200() {
            local label="$1"
            local path="$2"
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000${path}")
            echo "${label}: ${code}"
            if [ "$code" != "200" ]; then
              echo "Smoke test failed for ${path}: expected 200, got ${code}"
              exit 1
            fi
          }
          check_200 "Homepage" "/"
          check_200 "Admin Login Page" "/admin/login"
          check_200 "User Login Page" "/login"
          check_200 "Public Result Page" "/result"
          check_200 "All Courses Page" "/all-course"
          check_200 "Health" "/health"

      - name: Run Playwright Tests
        run: |
          npx playwright test \
            tests/e2e/frontend.spec.js \
            tests/e2e/frontend-connectivity.spec.js \
            > playwright-output.log 2>&1 || (cat playwright-output.log && exit 1)
        env:
          APP_URL: http://127.0.0.1:8000
          ADMIN_EMAIL: admin@gmail.com
          ADMIN_PASSWORD: '12345678'
          CENTER_EMAIL: center@gmail.com
          CENTER_PASSWORD: '12345678'

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.run_number }}
          path: |
            playwright-output.log
            setup.log
          retention-days: 3
