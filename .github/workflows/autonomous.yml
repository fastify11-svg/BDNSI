name: Autonomous CI Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# CI-ONLY pipeline — no production SSH deployment.
# Production deployment is performed directly from Antigravity IDE via SSH.
# DEPLOYMENT_METHOD = ANTIGRAVITY_DIRECT_SSH → nenobet.live
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Autonomous Lifecycle
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bdnsi_testing
          MYSQL_USER: bdnsi_test_user
          MYSQL_PASSWORD: safe_test_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      # ─── 1. CHECKOUT ─────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ─── 2. PHP SETUP ────────────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, sqlite3, gd, zip
          coverage: none

      # ─── 3. ENVIRONMENT SETUP ────────────────────────────────────────────
      - name: Setup Environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=bdnsi_testing/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=bdnsi_test_user/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=safe_test_password/' .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=true/' .env
          sed -i 's/APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/CACHE_DRIVER=.*/CACHE_DRIVER=file/' .env
          sed -i 's/SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=/' .env
          sed -i 's/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          echo "APP_URL=http://127.0.0.1:8000" >> .env
          echo "CI=true" >> .env
          echo "--- .env DB/Session config ---"
          grep -E '^(DB_|SESSION_|CACHE_|APP_URL|APP_ENV|QUEUE_)' .env

      # ─── 4. COMPOSER ─────────────────────────────────────────────────────
      # Install without Composer scripts first so Laravel boots only after the
      # CI environment has a valid APP_KEY. Then run package discovery explicitly.
      - name: Install Composer Dependencies
        run: composer install --no-scripts --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Generate App Key
        run: php artisan key:generate

      - name: Discover Composer Packages
        run: php artisan package:discover --ansi

      # ─── 5. DATABASE ─────────────────────────────────────────────────────
      - name: Run Database Migrations & Seeding
        run: |
          php artisan migrate:fresh --seed --force -vvv > setup.log 2>&1 || (cat setup.log && exit 1)
          echo "--- Verify admin was seeded ---"
          php artisan tinker --execute="echo 'Admin count: ' . \App\Models\Admin::count() . PHP_EOL . 'Admin email: ' . (\App\Models\Admin::first()->email ?? 'NONE');"

      - name: Run PHP Regression Suite
        run: php artisan test

      # ─── 6. NODE.JS & NPM ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      # ─── 7. BUILD FRONTEND ───────────────────────────────────────────────
      - name: Compile Frontend Assets
        run: |
          npm run build
          echo "--- Verify build output ---"
          ls -la public/build/manifest.json 2>/dev/null || ls -la public/build/.vite/manifest.json 2>/dev/null || echo "WARNING: No Vite manifest found!"
          ls -la public/build/assets/ | head -5
        env:
          NODE_ENV: production

      # ─── 8. PLAYWRIGHT TESTS ─────────────────────────────────────────────
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Install wait-on
        run: npm install -g wait-on

      - name: Start Laravel Server
        run: php artisan serve --host=127.0.0.1 --port=8000 > /dev/null 2>&1 &

      - name: Wait for Server to be Ready
        run: wait-on http://127.0.0.1:8000 -t 30000

      - name: Smoke Test - Verify Server Responds
        run: |
          echo "--- Testing key routes ---"
          curl -s -o /dev/null -w "Homepage: %{http_code}\n" http://127.0.0.1:8000/
          curl -s -o /dev/null -w "Admin Login Page: %{http_code}\n" http://127.0.0.1:8000/admin/login
          curl -s -o /dev/null -w "User Login Page: %{http_code}\n" http://127.0.0.1:8000/login
          curl -s -o /dev/null -w "Public Result Page: %{http_code}\n" http://127.0.0.1:8000/result
          curl -s -o /dev/null -w "All Courses Page: %{http_code}\n" http://127.0.0.1:8000/all-course
          echo "--- Testing /health endpoint ---"
          HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health)
          echo "Health check response code: $HEALTH_CODE"
          if [ "$HEALTH_CODE" = "200" ]; then
            echo "Health smoke check: PASS"
          else
            echo "Health smoke check: WARNING - unexpected HTTP $HEALTH_CODE"
          fi
        env:
          ADMIN_EMAIL: admin@gmail.com
          ADMIN_PASSWORD: "12345678"

      - name: Run Playwright Tests
        run: |
          npx playwright test \
            tests/e2e/frontend.spec.js \
            tests/e2e/frontend-connectivity.spec.js \
            > playwright-output.log 2>&1 || (cat playwright-output.log && exit 1)
        env:
          APP_URL: http://127.0.0.1:8000
          ADMIN_EMAIL: admin@gmail.com
          ADMIN_PASSWORD: '12345678'
          CENTER_EMAIL: center@gmail.com
          CENTER_PASSWORD: '12345678'

      # NOTE: Production deployment is NOT handled here.
      # DEPLOYMENT_METHOD = ANTIGRAVITY_DIRECT_SSH
      # Target: nenobet.live (u881397359@145.79.212.19 port 65002)
      # Run deploy script: node deploy_to_production.mjs
      # See .ai/PROJECT_STATE.md for deployment architecture.

      # ─── 9. ARTIFACTS ON FAILURE ─────────────────────────────────────────
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.run_number }}
          path: |
            playwright-output.log
            setup.log
          retention-days: 3
