name: Build Full Upload Ready Package

on:
  push:
    branches:
      - export/upload-ready-20260913

jobs:
  package:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bdnsi_package
          MYSQL_USER: bdnsi_package_user
          MYSQL_PASSWORD: safe_package_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout package branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to exact main source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 2e6c63ccb0b73ffab21ef74823d0827f7599c9a9
          test "$(git rev-parse HEAD)" = "2e6c63ccb0b73ffab21ef74823d0827f7599c9a9"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, gd, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/APP_ENV=.*/APP_ENV=production/' .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's#APP_URL=.*#APP_URL=https://YOUR-DOMAIN.COM#' .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=bdnsi_package/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=bdnsi_package_user/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=safe_package_password/' .env
          sed -i 's/CACHE_DRIVER=.*/CACHE_DRIVER=file/' .env || true
          sed -i 's/SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env || true
          sed -i 's/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env || true

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-dev --no-scripts --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader
          php artisan key:generate --force
          php artisan package:discover --ansi

      - name: Build frontend assets
        shell: bash
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps
          NODE_ENV=production npm run build
          test -d public/build/assets

      - name: Create fresh MySQL database dump
        shell: bash
        run: |
          set -euo pipefail
          php artisan migrate:fresh --force
          php artisan db:seed --class='Database\Seeders\LaratrustSeeder' --force
          php artisan db:seed --class='Database\Seeders\ConfigSeeder' --force
          php artisan db:seed --class='Database\Seeders\SiteConfigSeeder' --force

          INSTALL_ADMIN_PASSWORD="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9@#%+=_' | head -c 24)"
          export INSTALL_ADMIN_PASSWORD
          php artisan tinker --execute='use App\Models\Admin; use App\Models\Role; use Illuminate\Support\Facades\Hash; $p=getenv("INSTALL_ADMIN_PASSWORD"); $a=Admin::updateOrCreate(["email"=>"admin@bdnsi.local"],["name"=>"BDNSI Administrator","password"=>Hash::make($p)]); $r=Role::whereName("admin")->first(); if ($r) { $a->syncRoles([$r]); }'
          printf 'Admin login for this fresh database\nEmail: admin@bdnsi.local\nPassword: %s\n\nChange this password immediately after first login.\n' "$INSTALL_ADMIN_PASSWORD" > FIRST_LOGIN.txt

          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client
          mysqldump -h127.0.0.1 -P3306 -ubdnsi_package_user -psafe_package_password --single-transaction --routines --triggers --no-tablespaces --default-character-set=utf8mb4 bdnsi_package > database.sql
          test -s database.sql

      - name: Assemble full upload-ready folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package_out
          mkdir -p package_out/BDNSI_READY_UPLOAD
          git archive 2e6c63ccb0b73ffab21ef74823d0827f7599c9a9 | tar -x -C package_out/BDNSI_READY_UPLOAD
          cp -a vendor package_out/BDNSI_READY_UPLOAD/vendor
          rm -rf package_out/BDNSI_READY_UPLOAD/public/build
          cp -a public/build package_out/BDNSI_READY_UPLOAD/public/build
          cp database.sql package_out/BDNSI_READY_UPLOAD/database.sql
          cp FIRST_LOGIN.txt package_out/BDNSI_READY_UPLOAD/FIRST_LOGIN.txt

          APP_KEY_LINE="$(grep '^APP_KEY=' .env | head -n1)"
          cp .env.example package_out/BDNSI_READY_UPLOAD/.env
          sed -i 's/APP_ENV=.*/APP_ENV=production/' package_out/BDNSI_READY_UPLOAD/.env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=false/' package_out/BDNSI_READY_UPLOAD/.env
          sed -i 's#APP_URL=.*#APP_URL=https://YOUR-DOMAIN.COM#' package_out/BDNSI_READY_UPLOAD/.env
          sed -i "s#^APP_KEY=.*#${APP_KEY_LINE}#" package_out/BDNSI_READY_UPLOAD/.env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' package_out/BDNSI_READY_UPLOAD/.env
          sed -i 's/DB_HOST=.*/DB_HOST=localhost/' package_out/BDNSI_READY_UPLOAD/.env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' package_out/BDNSI_READY_UPLOAD/.env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=CHANGE_ME/' package_out/BDNSI_READY_UPLOAD/.env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=CHANGE_ME/' package_out/BDNSI_READY_UPLOAD/.env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=CHANGE_ME/' package_out/BDNSI_READY_UPLOAD/.env
          sed -i 's/CACHE_DRIVER=.*/CACHE_DRIVER=file/' package_out/BDNSI_READY_UPLOAD/.env || true
          sed -i 's/SESSION_DRIVER=.*/SESSION_DRIVER=file/' package_out/BDNSI_READY_UPLOAD/.env || true
          sed -i 's/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' package_out/BDNSI_READY_UPLOAD/.env || true

          mkdir -p package_out/BDNSI_READY_UPLOAD/storage/framework/cache/data
          mkdir -p package_out/BDNSI_READY_UPLOAD/storage/framework/sessions
          mkdir -p package_out/BDNSI_READY_UPLOAD/storage/framework/views
          mkdir -p package_out/BDNSI_READY_UPLOAD/storage/logs
          mkdir -p package_out/BDNSI_READY_UPLOAD/storage/app/public
          mkdir -p package_out/BDNSI_READY_UPLOAD/bootstrap/cache

          cat > package_out/BDNSI_READY_UPLOAD/UPLOAD_README.txt <<'TXT'
BDNSI FULL UPLOAD-READY PACKAGE

1. Upload/extract the contents of BDNSI_READY_UPLOAD into public_html.
2. Import database.sql into a fresh MySQL database.
3. Edit .env: APP_URL, DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD.

No Composer install is required on hosting because vendor is included.
No npm build is required on hosting because public/build is included.
The root .htaccess already routes requests to Laravel public/.
Use FIRST_LOGIN.txt for the fresh admin and change its password after login.
TXT
          printf '%s\n' '2e6c63ccb0b73ffab21ef74823d0827f7599c9a9' > package_out/BDNSI_READY_UPLOAD/SOURCE_COMMIT.txt

      - name: Create and validate ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd package_out
          zip -qry -y BDNSI_READY_UPLOAD_FULL.zip BDNSI_READY_UPLOAD
          sha256sum BDNSI_READY_UPLOAD_FULL.zip > BDNSI_READY_UPLOAD_FULL.sha256
          unzip -tq BDNSI_READY_UPLOAD_FULL.zip
          ls -lh BDNSI_READY_UPLOAD_FULL.zip BDNSI_READY_UPLOAD_FULL.sha256

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDNSI_READY_UPLOAD_FULL
          path: |
            package_out/BDNSI_READY_UPLOAD_FULL.zip
            package_out/BDNSI_READY_UPLOAD_FULL.sha256
          retention-days: 7
          compression-level: 0
