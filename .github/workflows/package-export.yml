name: BDNSI Upload Ready Package

on:
  push:
    branches:
      - export/package-20260913

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout export branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, gd, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Build full upload-ready package
        shell: bash
        run: bash .github/scripts/build-upload-ready-package.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: BDNSI_READY_UPLOAD_FULL
          path: |
            package_out/BDNSI_READY_UPLOAD_FULL.zip
            package_out/BDNSI_READY_UPLOAD_FULL.sha256
          retention-days: 7
          compression-level: 0
