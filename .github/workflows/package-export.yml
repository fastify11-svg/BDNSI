name: Full Main Archive

on:
  push:
    branches:
      - export/package-20260913

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout export branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact main repository archive
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e edccb636b08d92fc7194d8f9bfdca5a303f3fa63^{commit}
          git archive \
            --format=zip \
            --output=BDNSI_MAIN_edccb636_COMPLETE.zip \
            --prefix=BDNSI/ \
            edccb636b08d92fc7194d8f9bfdca5a303f3fa63
          sha256sum BDNSI_MAIN_edccb636_COMPLETE.zip > BDNSI_MAIN_edccb636_COMPLETE.sha256
          ls -lh BDNSI_MAIN_edccb636_COMPLETE.zip BDNSI_MAIN_edccb636_COMPLETE.sha256

      - name: Upload exact archive
        uses: actions/upload-artifact@v4
        with:
          name: BDNSI_MAIN_COMPLETE
          path: |
            BDNSI_MAIN_edccb636_COMPLETE.zip
            BDNSI_MAIN_edccb636_COMPLETE.sha256
          retention-days: 3
          compression-level: 0
