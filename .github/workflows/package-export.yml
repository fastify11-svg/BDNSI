name: Package Export

on:
  push:
    branches:
      - export/package-20260913

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare fresh MySQL-ready setup files
        shell: bash
        run: |
          set -euo pipefail
          cat > .env.install.example <<'EOF'
APP_NAME=BDNSI
APP_ENV=production
APP_KEY=
APP_DEBUG=false
APP_URL=https://example.com

LOG_CHANNEL=stack
LOG_LEVEL=error

DB_CONNECTION=mysql
DB_HOST=127.0.0.1
DB_PORT=3306
DB_DATABASE=YOUR_DATABASE_NAME
DB_USERNAME=YOUR_DATABASE_USERNAME
DB_PASSWORD=YOUR_DATABASE_PASSWORD

CACHE_STORE=file
SESSION_DRIVER=file
QUEUE_CONNECTION=database
EOF
          cat > FRESH_SETUP_README.txt <<'EOF'
BDNSI FRESH SETUP PACKAGE
Source commit: edccb636b08d92fc7194d8f9bfdca5a303f3fa63

1. Copy .env.install.example to .env.
2. Insert your MySQL database name, username and password in .env.
3. Run: composer install --no-dev --optimize-autoloader
4. Run: php artisan key:generate --force
5. Run: php artisan migrate --force
6. Run: php artisan storage:link
7. Run: php artisan optimize
8. Configure the web root to the /public directory.
9. Configure queue worker / scheduler as required by the hosting environment.

Security note: No real database password is stored in this archive.
EOF

      - name: Build deployment archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -rq9 dist/BDNSI_FRESH_SETUP.zip . \
            -x '.git/*' \
            -x '.github/workflows/package-export.yml' \
            -x 'dist/*' \
            -x 'vendor/*' \
            -x 'node_modules/*' \
            -x '.env' \
            -x 'storage/logs/*' \
            -x 'storage/framework/cache/*' \
            -x 'storage/framework/sessions/*' \
            -x 'storage/framework/views/*'
          ls -lh dist/BDNSI_FRESH_SETUP.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: BDNSI_FRESH_SETUP
          path: dist/BDNSI_FRESH_SETUP.zip
          retention-days: 3
          compression-level: 0

