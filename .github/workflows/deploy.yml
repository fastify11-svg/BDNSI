name: Production Auto Deploy

on:
  workflow_run:
    workflows: ["Autonomous CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: bdnsi-production-deploy-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Hostinger SSH preflight and deploy
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      SSH_HOST: 145.79.212.19
      SSH_PORT: '65002'
      SSH_USER: u881397359
      REMOTE_PATH: /home/u881397359/domains/nenobet.live/public_html
      REMOTE_BACKUP_DIR: /home/u881397359/bdnsi_release_backups
      HEALTH_URL: https://nenobet.live/health
      REPO_URL: https://github.com/fastify11-svg/BDNSI.git
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      KEY_BDNSI: ${{ secrets.BDNSI_SSH_PRIVATE_KEY }}
      KEY_HOSTINGER: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      KEY_GENERIC: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_HOSTINGER_ALT: ${{ secrets.HOSTINGER_PRIVATE_KEY }}
      KEY_DEPLOY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
      PASS_BDNSI: ${{ secrets.BDNSI_SSH_PASSWORD }}
      PASS_HOSTINGER: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
      PASS_GENERIC: ${{ secrets.SSH_PASSWORD }}
      PASS_HOSTINGER_LEGACY: ${{ secrets.HOSTINGER_PASSWORD }}
      PASSPHRASE_BDNSI: ${{ secrets.BDNSI_SSH_PASSPHRASE }}
      PASSPHRASE_GENERIC: ${{ secrets.SSH_PASSPHRASE }}
      PASSPHRASE_HOSTINGER: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
      SSH_KNOWN_HOSTS: ${{ secrets.BDNSI_SSH_KNOWN_HOSTS || secrets.HOSTINGER_SSH_KNOWN_HOSTS || secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify exact main SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Validate configured SSH credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          python3 - <<'PY'
          import os, base64, pathlib, subprocess, shutil

          root = pathlib.Path.home() / '.ssh'
          github_env = pathlib.Path(os.environ['GITHUB_ENV'])
          key_sources = [
              ('BDNSI_SSH_PRIVATE_KEY', os.environ.get('KEY_BDNSI', '')),
              ('HOSTINGER_SSH_PRIVATE_KEY', os.environ.get('KEY_HOSTINGER', '')),
              ('SSH_PRIVATE_KEY', os.environ.get('KEY_GENERIC', '')),
              ('HOSTINGER_PRIVATE_KEY', os.environ.get('KEY_HOSTINGER_ALT', '')),
              ('DEPLOY_PRIVATE_KEY', os.environ.get('KEY_DEPLOY', '')),
          ]
          password_sources = [
              ('BDNSI_SSH_PASSWORD', os.environ.get('PASS_BDNSI', '')),
              ('HOSTINGER_SSH_PASSWORD', os.environ.get('PASS_HOSTINGER', '')),
              ('SSH_PASSWORD', os.environ.get('PASS_GENERIC', '')),
              ('HOSTINGER_PASSWORD', os.environ.get('PASS_HOSTINGER_LEGACY', '')),
          ]
          passphrases = list(dict.fromkeys([
              '',
              os.environ.get('PASSPHRASE_BDNSI', ''),
              os.environ.get('PASSPHRASE_GENERIC', ''),
              os.environ.get('PASSPHRASE_HOSTINGER', ''),
          ]))

          print('Configured private-key slots:', ', '.join(name for name, value in key_sources if value) or 'none')
          print('Configured SSH-password slots:', ', '.join(name for name, value in password_sources if value) or 'none')

          candidates = []
          seen = set()
          for source, raw in key_sources:
              if not raw:
                  continue
              raw = raw.strip().replace('\r\n', '\n')
              variants = [raw, raw.replace('\\r', '').replace('\\n', '\n')]
              try:
                  decoded = base64.b64decode(''.join(raw.split()), validate=True).decode('utf-8')
                  variants += [decoded, decoded.replace('\\r', '').replace('\\n', '\n')]
              except Exception:
                  pass
              for variant in variants:
                  variant = variant.strip()
                  if variant and variant not in seen:
                      seen.add(variant)
                      candidates.append((source, variant))

          selected = None
          selected_source = None
          for index, (source, candidate) in enumerate(candidates):
              path = root / f'candidate_{index}'
              path.write_text(candidate + '\n')
              path.chmod(0o600)
              for passphrase in passphrases:
                  result = subprocess.run(
                      ['ssh-keygen', '-y', '-P', passphrase, '-f', str(path)],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if result.returncode == 0:
                      selected = path
                      selected_source = source
                      break
              if selected:
                  break

          if selected:
              target = root / 'bdnsi_deploy'
              shutil.copyfile(selected, target)
              target.chmod(0o600)
              with github_env.open('a') as f:
                  f.write('AUTH_MODE=key\n')
                  f.write(f'AUTH_SOURCE={selected_source}\n')
              print(f'Validated usable SSH private key from {selected_source}.')
          else:
              password = next(((name, value) for name, value in password_sources if value), None)
              if not password:
                  print('::error::No usable SSH private key and no configured SSH password secret were found.')
                  raise SystemExit(1)
              source, value = password
              delimiter = '__BDNSI_PASSWORD__'
              with github_env.open('a') as f:
                  f.write('AUTH_MODE=password\n')
                  f.write(f'AUTH_SOURCE={source}\n')
                  f.write(f'SSH_PASSWORD_SELECTED<<{delimiter}\n{value}\n{delimiter}\n')
              print(f'Using configured SSH password from {source}.')

          for path in root.glob('candidate_*'):
              path.unlink(missing_ok=True)
          PY

          if [ "${AUTH_MODE:-}" = "password" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            echo "HOST_KEY_MODE=strict" >> "$GITHUB_ENV"
          else
            : > "$HOME/.ssh/known_hosts"
            echo "HOST_KEY_MODE=accept-new" >> "$GITHUB_ENV"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only SSH preflight
        shell: bash
        run: |
          set -euo pipefail
          STRICT_MODE=yes
          if [ "$HOST_KEY_MODE" = "accept-new" ]; then STRICT_MODE=accept-new; fi
          COMMON_OPTS=(-o ConnectTimeout=20 -o ConnectionAttempts=2 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking="$STRICT_MODE" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$SSH_PORT")

          if [ "$AUTH_MODE" = "key" ]; then
            SSH=(ssh -i "$HOME/.ssh/bdnsi_deploy" -o BatchMode=yes "${COMMON_OPTS[@]}")
          else
            export SSHPASS="$SSH_PASSWORD_SELECTED"
            SSH=(sshpass -e ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no "${COMMON_OPTS[@]}")
          fi

          echo "Testing Hostinger SSH endpoint ${SSH_HOST}:${SSH_PORT} as ${SSH_USER} using ${AUTH_SOURCE}..."
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "bash -s" <<EOF
          set -euo pipefail
          command -v git >/dev/null || { echo 'PREFLIGHT_FAIL: git missing'; exit 31; }
          command -v php >/dev/null || { echo 'PREFLIGHT_FAIL: php missing'; exit 32; }
          command -v composer >/dev/null || { echo 'PREFLIGHT_FAIL: composer missing'; exit 33; }
          test -d '$REMOTE_PATH' || { echo 'PREFLIGHT_FAIL: remote path missing'; exit 34; }
          test -f '$REMOTE_PATH/.env' || { echo 'PREFLIGHT_FAIL: .env missing'; exit 35; }
          php -r 'exit(version_compare(PHP_VERSION, "8.3.0", ">=") ? 0 : 1);' || { echo 'PREFLIGHT_FAIL: PHP below 8.3'; exit 36; }
          echo 'SSH_PREFLIGHT_OK'
          whoami
          hostname
          EOF

      - name: Deploy exact green SHA safely
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          STRICT_MODE=yes
          if [ "$HOST_KEY_MODE" = "accept-new" ]; then STRICT_MODE=accept-new; fi
          COMMON_OPTS=(-o ConnectTimeout=20 -o ConnectionAttempts=2 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking="$STRICT_MODE" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$SSH_PORT")

          if [ "$AUTH_MODE" = "key" ]; then
            SSH=(ssh -i "$HOME/.ssh/bdnsi_deploy" -o BatchMode=yes "${COMMON_OPTS[@]}")
          else
            export SSHPASS="$SSH_PASSWORD_SELECTED"
            SSH=(sshpass -e ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no "${COMMON_OPTS[@]}")
          fi

          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "bash -s" <<EOF
          set -euo pipefail
          REMOTE_PATH='$REMOTE_PATH'
          REMOTE_BACKUP_DIR='$REMOTE_BACKUP_DIR'
          RELEASE_SHA='$RELEASE_SHA'
          REPO_URL='$REPO_URL'
          cd "\$REMOTE_PATH"
          test -f .env
          mkdir -p "\$REMOTE_BACKUP_DIR"
          chmod 700 "\$REMOTE_BACKUP_DIR"
          cp .env "\$REMOTE_BACKUP_DIR/env_\$(date +%Y%m%d_%H%M%S).backup"
          chmod 600 "\$REMOTE_BACKUP_DIR"/env_*.backup
          if [ ! -d .git ]; then git init; fi
          if git remote get-url origin >/dev/null 2>&1; then git remote set-url origin "\$REPO_URL"; else git remote add origin "\$REPO_URL"; fi
          git fetch origin main
          test "\$(git rev-parse origin/main)" = "\$RELEASE_SHA"
          git reset --hard "\$RELEASE_SHA"
          test -f .env
          composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
          php artisan package:discover --ansi
          php artisan migrate --force
          php artisan storage:link >/dev/null 2>&1 || true
          php artisan optimize:clear
          php artisan config:cache
          php artisan view:cache
          php artisan queue:restart >/dev/null 2>&1 || true
          test "\$(git rev-parse HEAD)" = "\$RELEASE_SHA"
          EOF

      - name: Verify live health
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(curl -L -sS -o /tmp/health.txt -w '%{http_code}' --max-time 20 "$HEALTH_URL" || true)"
            echo "Health attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          cat /tmp/health.txt || true
          exit 1
