name: Autonomous AI Supervisor

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  supervisor_review:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-supervisor')"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: AgentRouter Auth Preflight
        env:
          AI_SUPERVISOR_API_KEY: ${{ secrets.AI_SUPERVISOR_API_KEY }}
          AI_SUPERVISOR_BASE_URL: https://co.agentrouter.org/v1
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AI_SUPERVISOR_API_KEY:-}" ]; then
            echo "FATAL: AI_SUPERVISOR_API_KEY secret is missing."
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o /tmp/agentrouter-preflight.json -w "%{http_code}" \
            -H "Authorization: Bearer ${AI_SUPERVISOR_API_KEY}" \
            -H "Accept: application/json" \
            "${AI_SUPERVISOR_BASE_URL}/models")
          CONTENT_TYPE=$(file -b --mime-type /tmp/agentrouter-preflight.json || true)
          echo "AgentRouter preflight HTTP status: ${HTTP_CODE}"
          echo "AgentRouter preflight response type: ${CONTENT_TYPE}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "AgentRouter authentication/connectivity preflight failed."
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/agentrouter-preflight.json')
          raw=p.read_text(errors='replace')[:800] if p.exists() else ''
          try:
              obj=json.loads(raw)
              safe={k:v for k,v in obj.items() if k.lower() not in {'token','api_key','apikey','key','authorization'}}
              print('Safe provider response:', json.dumps(safe, ensure_ascii=False)[:600])
          except Exception:
              print('Provider returned a non-JSON error response.')
          PY
            exit 1
          fi
          echo "AgentRouter authentication preflight passed."

      - name: Run Supervisor Bridge
        env:
          AI_SUPERVISOR_API_KEY: ${{ secrets.AI_SUPERVISOR_API_KEY }}
          AI_SUPERVISOR_BASE_URL: https://co.agentrouter.org/v1
          AI_SUPERVISOR_MODEL: ${{ vars.AI_SUPERVISOR_MODEL }}
        run: |
          node scripts/ai-supervisor/supervisor.mjs

      - name: Commit Supervisor Reports
        if: success()
        run: |
          git config --global user.name "AI Supervisor"
          git config --global user.email "supervisor@ai.local"
          git add .ai/REVIEW_REPORT.md .ai/FIX_REQUEST.md .ai/PROJECT_STATE.md .ai/supervisor/bridge-state.json || true
          git commit -m "Auto-generated Supervisor Review [skip-supervisor]" || echo "No changes to commit"
          git push
