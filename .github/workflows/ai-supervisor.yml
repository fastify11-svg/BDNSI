name: Legacy AI Supervisor (Manual Only)

# Cursor is now the active development workflow. The old external AgentRouter
# supervisor is retained only as a reversible/manual diagnostic and must not
# create failing checks on normal pushes or pull requests.
on:
  workflow_dispatch:

jobs:
  supervisor_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Legacy Supervisor Bridge
        env:
          AI_SUPERVISOR_API_KEY: ${{ secrets.AI_SUPERVISOR_API_KEY }}
          AI_SUPERVISOR_BASE_URL: ${{ vars.AI_SUPERVISOR_BASE_URL || 'https://agentrouter.org/v1' }}
          AI_SUPERVISOR_MODEL: ${{ vars.AI_SUPERVISOR_MODEL || 'gpt-4o' }}
        run: node scripts/ai-supervisor/supervisor.mjs

      - name: Preserve Reports Locally
        if: always()
        run: |
          echo "Legacy supervisor is manual-only during Cursor handoff."
          git status --short
