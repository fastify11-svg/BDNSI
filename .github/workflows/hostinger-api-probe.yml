name: Production Environment Credential Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    env:
      ENV_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ENV_HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      ENV_SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      ENV_HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
      ENV_HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Validate production environment credential presence and key format
        shell: bash
        run: |
          set -euo pipefail
          present() { if [ -n "$2" ]; then echo "$1=PRESENT"; else echo "$1=ABSENT"; fi; }
          present SSH_PRIVATE_KEY "$ENV_SSH_PRIVATE_KEY"
          present HOSTINGER_SSH_PRIVATE_KEY "$ENV_HOSTINGER_SSH_PRIVATE_KEY"
          present SSH_PASSWORD "$ENV_SSH_PASSWORD"
          present HOSTINGER_SSH_PASSWORD "$ENV_HOSTINGER_SSH_PASSWORD"
          present HOSTINGER_API_TOKEN "$ENV_HOSTINGER_API_TOKEN"

          valid=0
          for value in "$ENV_HOSTINGER_SSH_PRIVATE_KEY" "$ENV_SSH_PRIVATE_KEY"; do
            [ -n "$value" ] || continue
            printf '%s\n' "$value" > /tmp/key
            chmod 600 /tmp/key
            if ssh-keygen -y -P '' -f /tmp/key >/dev/null 2>&1; then
              valid=1
              break
            fi
          done
          echo "VALID_PRIVATE_KEY=$valid"
