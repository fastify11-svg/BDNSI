name: Hostinger Remote Config Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      V_HOSTINGER_API_TOKEN: ${{ vars.HOSTINGER_API_TOKEN }}
      V_HOSTINGER_TOKEN: ${{ vars.HOSTINGER_TOKEN }}
      V_SSH_PASSWORD: ${{ vars.SSH_PASSWORD }}
      V_HOSTINGER_PASSWORD: ${{ vars.HOSTINGER_PASSWORD }}
      V_FTP_PASSWORD: ${{ vars.FTP_PASSWORD }}
      V_HOSTINGER_FTP_PASSWORD: ${{ vars.HOSTINGER_FTP_PASSWORD }}
      V_SSH_PRIVATE_KEY: ${{ vars.SSH_PRIVATE_KEY }}
      V_SSH_HOST: ${{ vars.SSH_HOST }}
      V_SSH_PORT: ${{ vars.SSH_PORT }}
      V_SSH_USER: ${{ vars.SSH_USER }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local label="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "$label=PRESENT"
            else
              echo "$label=ABSENT"
            fi
          }
          check HOSTINGER_API_TOKEN "$V_HOSTINGER_API_TOKEN"
          check HOSTINGER_TOKEN "$V_HOSTINGER_TOKEN"
          check SSH_PASSWORD "$V_SSH_PASSWORD"
          check HOSTINGER_PASSWORD "$V_HOSTINGER_PASSWORD"
          check FTP_PASSWORD "$V_FTP_PASSWORD"
          check HOSTINGER_FTP_PASSWORD "$V_HOSTINGER_FTP_PASSWORD"
          check SSH_PRIVATE_KEY "$V_SSH_PRIVATE_KEY"
          check SSH_HOST "$V_SSH_HOST"
          check SSH_PORT "$V_SSH_PORT"
          check SSH_USER "$V_SSH_USER"
